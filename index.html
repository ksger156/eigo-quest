const KEYS=["lv1", "lv2", "lv3", "lv4", "lv5", "lv6", "lv7", "lv8", "lv9", "lv10", "prefix", "grammar"];
const MAIN=["lv1", "lv2", "lv3", "lv4", "lv5", "lv6", "lv7", "lv8", "lv9", "lv10"];
const STATE_KEY="eigoQuestStateV1", SAFETY_KEY="eigoQuestStateV1_backup";
const letters=["A","B","C","D"];
const empty=()=>({logs:[],seen:{},wrongCount:{},sets:{},completed:{}});
function load(){for(const k of [STATE_KEY,SAFETY_KEY]){let r=localStorage.getItem(k);if(r)try{let s=JSON.parse(r);s.seen||={};s.wrongCount||={};return s}catch(e){}}return empty()}
function save(s){let d=JSON.stringify(s);localStorage.setItem(STATE_KEY,d);localStorage.setItem(SAFETY_KEY,d)}
let state=load(),session=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function today(){return new Date().toISOString().slice(0,10)}
function stats(k){let total=COURSES[k].questions.length;let correct=new Set(state.logs.filter(x=>x.course===k&&x.ok).map(x=>x.qid)).size;return {total,correct,pct:Math.round(correct/total*100)}}
function allAcc(){return state.logs.length?Math.round(state.logs.filter(x=>x.ok).length/state.logs.length*100):0}
function home(){
 let main=MAIN.map(k=>card(k,"MAIN")).join("");
 let ex=["prefix","grammar"].map(k=>card(k,"EX")).join("");
 document.getElementById("app").innerHTML=`<div class="top"><div class="brand">英語クエスト 🇬🇧</div><button class="menuBtn" onclick="menu()">☰</button></div>
 <h1>10問だけ、英語。</h1><div class="sub">単語だけ丸暗記ではなく、短文の中で意味を取る。未出題を優先して、間違いはあとで再登場。</div>
 <div class="stats"><div class="stat"><b>${state.logs.filter(x=>x.date===today()).length}</b>今日</div><div class="stat"><b>${allAcc()}%</b>正答率</div><div class="stat"><b>${Object.keys(state.completed).length}</b>クリア</div></div>
 <div class="section">VOCABULARY QUEST</div>${main}<div class="section">BONUS QUEST</div>${ex}
 <div class="note">LV10は「大学受験語彙帯」のオリジナル問題。特定校の過去問転載・完全準拠ではありません。</div>`;
}
function card(k,label){let c=COURSES[k],p=stats(k);return `<div class="course"><div style="flex:1"><span class="badge">${label}</span><h3>${state.completed[k]?c.trophy+" ":""}${c.title}</h3><p>${c.subtitle}　全${p.total}問</p><div class="bar"><div class="fill" style="width:${p.pct}%"></div></div><p style="margin-top:4px">${p.correct} / ${p.total} 正解済み</p></div><button class="go" onclick="start('${k}')">10問</button></div>`}
function select(k){let all=COURSES[k].questions.map((q,i)=>({q,i})),seen=new Set(state.seen[k]||[]),unseen=all.filter(x=>!seen.has(x.i));if(unseen.length>=10)return shuffle(unseen).slice(0,10);let picked=shuffle(unseen).slice(),used=new Set(picked.map(x=>x.i)),wc=state.wrongCount[k]||{};let rest=all.filter(x=>!used.has(x.i)).sort((a,b)=>(wc[b.i]||0)-(wc[a.i]||0));let top=rest.slice(0,Math.min(30,rest.length));shuffle(top);for(let x of top)if(picked.length<10&&!used.has(x.i)){picked.push(x);used.add(x.i)};for(let x of shuffle(rest.filter(x=>!used.has(x.i))))if(picked.length<10)picked.push(x);return picked}
function start(k){session={k,items:select(k),pos:0,score:0,wrong:[]};render()}
function render(){let o=session.items[session.pos],q=o.q,opts=[{t:q.answer,ok:true},...q.distractors.map(t=>({t,ok:false}))];shuffle(opts);session.opts=opts;session.answered=false;document.getElementById("app").innerHTML=`<div class="quiz"><div class="top"><div><span class="badge">${COURSES[session.k].title}</span> <b>${session.pos+1}/${session.items.length}</b></div><button class="menuBtn" onclick="menu()">☰</button></div><div class="q">${q.prompt}${q.speak?`<br><button class="speak" onclick="speakQ(event)">🔊 英文を聞く</button>`:""}</div><div class="choices">${opts.map((x,i)=>`<button class="choice" onclick="answer(${i})"><span class="letter">${letters[i]}</span><span>${x.t}</span></button>`).join("")}</div><div class="explain" id="exp"><span style="color:#777">答えると解説が出ます。</span></div><button class="next" id="next" disabled onclick="next()">${session.pos===session.items.length-1?"結果を見る":"次へ"}</button></div>`}
function speakQ(e){e.stopPropagation();let q=session.items[session.pos].q;if(!q.speak)return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(q.speak);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}catch(err){alert("このブラウザでは読み上げを使えないみたい。")}}
function answer(i){if(session.answered)return;session.answered=true;let o=session.items[session.pos],q=o.q,ok=session.opts[i].ok,bs=[...document.querySelectorAll(".choice")];bs.forEach((b,j)=>{b.disabled=true;if(session.opts[j].ok)b.classList.add("correct")});if(!ok){bs[i].classList.add("wrong");session.wrong.push(o)}else session.score++;state.seen[session.k]||=[];if(!state.seen[session.k].includes(o.i))state.seen[session.k].push(o.i);state.wrongCount[session.k]||={};if(!ok)state.wrongCount[session.k][o.i]=(state.wrongCount[session.k][o.i]||0)+1;state.logs.push({date:today(),ts:Date.now(),course:session.k,qid:o.i,ok});save(state);document.getElementById("exp").innerHTML=`<div class="result">${ok?"✅ 正解！":"❌ ちがうよ〜"}</div>${q.explain}`;document.getElementById("next").disabled=false}
function next(){if(session.pos<session.items.length-1){session.pos++;render()}else finish()}
function finish(){state.sets[session.k]=(state.sets[session.k]||0)+1;let full=COURSES[session.k].questions.every((q,i)=>state.logs.some(x=>x.course===session.k&&x.qid===i&&x.ok));if(full)state.completed[session.k]=true;save(state);let p=stats(session.k),w=[...new Map(session.wrong.map(x=>[x.i,x])).values()];document.getElementById("app").innerHTML=`<div class="top"><div class="brand">${COURSES[session.k].title}</div><button class="menuBtn" onclick="menu()">☰</button></div><div class="center"><div class="big">${full?COURSES[session.k].trophy:"🎯"}</div><div class="score">${session.score} / ${session.items.length}</div><div class="sub">このコース ${p.correct} / ${p.total} 正解済み</div>${w.length?`<div class="note">間違い ${w.length}問。今すぐもう一回できるよ。</div>`:""}<div class="actions">${w.length?`<button class="next" onclick="retry()">間違いだけ復習</button>`:""}<button class="next" onclick="start('${session.k}')">もう10問</button><button class="next secondary" onclick="home()">コース一覧へ</button></div></div>`}
function retry(){let u=[...new Map(session.wrong.map(x=>[x.i,x])).values()];shuffle(u);session={k:session.k,items:u,pos:0,score:0,wrong:[]};render()}
function backupText(){return JSON.stringify({app:"eigo-quest",version:1,exportedAt:new Date().toISOString(),state})}
async function copyBackup(){let d=backupText();try{await navigator.clipboard.writeText(d);alert("バックアップをコピーしたよ！")}catch(e){prompt("全部コピーしてね",d)}}
function restore(){let p=prompt("バックアップを貼り付けてね");if(!p)return;try{let x=JSON.parse(p.trim()),s=x.state||x;if(!Array.isArray(s.logs))throw 0;if(confirm("この記録に復元する？")){state=s;state.seen||={};state.wrongCount||={};save(state);closeMenu();home();alert("復元できたよ！")}}catch(e){alert("読み込めなかったよ。")}}
function jsonSave(){let b=new Blob([backupText()],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="eigo-quest-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function menu(){document.getElementById("panel").innerHTML=`<h3>メニュー</h3><button onclick="closeMenu();home()">🏠 コース一覧</button><button onclick="copyBackup()">📋 バックアップをコピー</button><button onclick="restore()">📥 バックアップから復元</button><button onclick="jsonSave()">💾 JSONで保存</button><button onclick="if(confirm('英語クエストの記録を全部消す？')){localStorage.removeItem(STATE_KEY);localStorage.removeItem(SAFETY_KEY);state=empty();closeMenu();home()}">🔄 最初からやり直す</button><button onclick="closeMenu()">閉じる</button>`;document.getElementById("sheet").classList.add("open")}
function closeMenu(){document.getElementById("sheet").classList.remove("open")}
home();
</script></body></html>
